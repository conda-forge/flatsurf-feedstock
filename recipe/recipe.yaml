schema_version: 1

context:
  name: flatsurf
  version: "3.15.2"

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/flatsurf/${{ name }}/releases/download/${{ version }}/${{ name }}-${{ version }}.tar.gz
  sha256: 3974c53de4dc5e4739659ae7e4c32a313d20ace7bd7b617e2a24575f50b62b29
  patches:
    - 0001-Make-compatible-with-fmt-11.patch
    - 0001-Fixed-compatibility-with-fmt-12.patch

build:
  number: 7
  # dependency libeantic is not available for Windows on conda-forge yet
  skip: win

outputs:
  - package:
      name: libflatsurf
    build:
      script:
        file: build-libflatsurf.sh
    requirements:
      build:
        - libtool
        - automake
        - make
        - gnuconfig
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
      host:
        # We only need the libboost-headers at compile time. However, since we
        # use bits of boost in our API, code built against libflatsurf must be
        # built with a compatible version of the headers. Therefore, we add a
        # liboost pin to our run exports so libboost-headers are going to be
        # in a compatible version.
        - libboost-devel
        - fmt
        - gmp
        - libflint
        - libintervalxt
        - libexactreal
        - libeantic
        - gmpxxll
      run_exports:
        - ${{ pin_subpackage("libflatsurf") }}
    tests:
      - script:
          - test -f $PREFIX/include/flatsurf/flatsurf.hpp
          - test -f $PREFIX/lib/libflatsurf${SHLIB_EXT}
  - package:
      name: pyflatsurf
    build:
      script:
        file: build-pyflatsurf.sh
    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
        - libtool
        - automake
        - make
        - gnuconfig
        - ${{ compiler('cxx') }}
        - ${{ stdlib("c") }}
      host:
        # Note that the libboost-devel from libflatsurf forces these headers to be
        # compatible with ones used when building libflatsurf.
        - libboost-headers
        - python
        - cppyy
        - cppyythonizations
        - setuptools
        - pytest
        - pyexactreal
        - pyintervalxt
        - ${{ pin_subpackage("libflatsurf") }}
      run:
        # cppyy dynamically compiles C++ wrappers at runtime, therefore we need C++ headers of boost.
        # Note that the libboost-devel from libflatsurf forces these headers to be
        # compatible with ones used when building libflatsurf.
        - libboost-headers
        - python
        - cppyy
        - cppyythonizations
        - gmpxxyy
        - pyexactreal
        - pyintervalxt
        # A subpackage does not see the run_exports of another subpackage:
        # https://github.com/conda/conda-build/issues/3478
        - ${{ pin_subpackage("libflatsurf") }}
    tests:
      - python:
          imports:
            - if: build_platform == target_platform
              then: pyflatsurf
          pip_check: false

about:
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: Algorithms on Flat Triangulations
  homepage: https://github.com/flatsurf/flatsurf
  repository: https://github.com/flatsurf/flatsurf

extra:
  recipe-maintainers:
    - saraedum
